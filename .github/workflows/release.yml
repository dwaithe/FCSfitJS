name: Auto release

# Runs after every push to main (i.e. every merged PR) and publishes a new
# GitHub release, bumping the patch version automatically (v0.0.10 -> v0.0.11).
# Release notes are generated by GitHub from the PRs/commits since the last
# release - no hand-written changelog needed.
#
# To merge something to main without triggering a release (e.g. a docs-only
# change), include "[skip release]" anywhere in the merge commit message.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          IFS='.' read -r major minor patch <<< "${latest#v}"
          next="v${major}.${minor}.$((patch + 1))"
          echo "Latest tag: $latest -> next: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "FoCuS-fit-JS ${{ steps.version.outputs.tag }}"
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
